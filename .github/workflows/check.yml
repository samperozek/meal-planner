name: check

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install reportlab openpyxl
      - run: python -m py_compile planner/*.py setup/tools/*.py tests/*.py
      - run: bash -n setup/tools/install.sh
      - run: python tests/smoke_test.py
